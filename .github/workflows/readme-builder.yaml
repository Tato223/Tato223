name: Build Profile README

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Dynamic Content
        uses: sarisia/actions-readme-feed@v1
        with:
          # This specifies your input template and your live README output target
          file: 'README.md'
          template: 'README.template.md'
          # This pulls your pinned or active public repositories directly into the template
          types: 'repo'

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: automated README update with latest projects"
          file_pattern: 'README.md'
