name: Build Profile README

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run README Compiler Script
        env:
          GITHUB_USER: \${{ github.repository_owner }}
        run: |
          npm install handlebars axios
          node - e "
          const fs = require('fs');
          const Handlebars = require('handlebars');
          const axios = require('axios');

          async function run() {
            try {
              // Fetch user's public repositories from GitHub API
              const res = await axios.get(\`https://github.com\${process.env.GITHUB_USER}/repos?sort=updated&per_page=5\`);
              const projects = res.data.map(r => ({
                name: r.name,
                description: r.description || 'No description provided.',
                html_url: r.html_url,
                stack: r.language || 'Markdown'
              }));

              // Read the template file
              const templateSource = fs.readFileSync('README.template.md', 'utf8');
              const template = Handlebars.compile(templateSource);

              // Inject projects data into BOTH naming variations to prevent errors
              const result = template({ currentProjects: projects, repo: projects });

              // Write the compiled contents to README.md
              fs.writeFileSync('README.md', result);
              console.log('README compiled successfully!');
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          run();
          "

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: automated README update with latest projects"
          file_pattern: 'README.md'
